name: MacroDroid geboortejaren
on:
  workflow_dispatch:
  push:
    paths:
      - 'data_raw/birthyear_import.csv'
      - 'data_raw/macrodroid_uploads/**'
      - 'data_raw/team_club_mapping.csv'
      - 'data_raw/player_matchdata.csv'
      - 'processing/birthyears.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Importeren en export vernieuwen
        run: python processing/birthyears.py refresh
      - name: Bewaar geboortejaren en export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in data_raw/player_birthyears.csv data_raw/macrodroid_missing_birthyears.csv; do
            if [ -f "$file" ]; then
              git add "$file"
            else
              echo "Bestand nog niet aangemaakt, overslaan: $file"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update birth years and MacroDroid export"
            git push
          fi
