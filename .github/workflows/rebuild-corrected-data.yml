name: Rebuild dashboard after calendar deduplication

on:
  push:
    branches: [main]
    paths:
      - 'processing/build_data_team.py'
      - 'processing/build_player_stats.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rbfa-manual-data-update
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild all derived data and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install pandas numpy scikit-learn
      - name: Validate clean source
        run: |
          python -m unittest discover -s tests -p 'test_match_flow.py'
          python -m unittest discover -s tests -p 'test_validate_match_data.py'
          python processing/validate_match_data.py
      - name: Recalculate standings, ELO, player statistics and exports
        run: |
          python processing/build_data_team.py
          python processing/build_team_stats.py
          python processing/build_data_matchevent.py
          python processing/build_player_stats.py
          python processing/export_json_local.py
          python processing/export_player_ages.py
          python processing/validate_dashboard_consistency.py
      - name: Build website
        run: npm run build
      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data_raw public/data
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate league standings and dashboard from 96 unique games"
            git push origin HEAD:main
          fi
      - name: Publish updated website
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: false
